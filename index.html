<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>픽셀 트리 QR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#04060a;--fg:#f3f8f4;--mut:#9fb3a5;--line:#2a4a35}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px 28px}
h1{font-size:1.5rem;margin:4px 0 0;font-weight:800;letter-spacing:-.01em;background:linear-gradient(90deg,#ff4d5e,#ffd54a,#4dff8c);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--mut);font-size:.9rem;text-align:center;line-height:1.55}
#stage{width:min(92vw,520px);aspect-ratio:1;background:#000;border-radius:16px;border:1px solid var(--line);box-shadow:0 0 28px #1fcf5c33,0 0 60px #ff334720;overflow:hidden;position:relative}
#stage.light{background:#f7f4ec;box-shadow:none}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#badge{position:absolute;left:12px;bottom:10px;font-size:.8rem;color:#aef5c3;background:#12301c;border:1px solid #2a6b42;border-radius:99px;padding:4px 10px;opacity:0;transition:opacity .25s}
#stage.light #badge{color:#16301f;background:#e3ecd9;border-color:#b9cfb0}
#badge.on{opacity:1}
.row{display:flex;gap:8px;width:min(92vw,520px);flex-wrap:wrap}
input{flex:1;min-width:140px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1510;color:var(--fg);font:inherit}
button{padding:10px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#e63946,#b8142a);color:#fff;font:inherit;cursor:pointer}
button.g{background:linear-gradient(135deg,#1fcf5c,#0e8a3b)}
input:focus-visible,button:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
</style>
</head>
<body>
<h1>🎄 픽셀 트리 속의 QR ✨</h1>
<p>평소엔 반짝이는 트리예요. 드래그해서 정확히 정면으로 돌리면 QR이 나타나요.</p>
<div id="stage"><canvas id="c"></canvas><span id="badge">정면 · QR 인식 가능</span></div>
<div class="row">
  <input id="txt" value="https://moouuuse.github.io/XMASYEAH/invite.html" aria-label="QR에 넣을 주소나 텍스트">
  <button id="apply" class="g">적용</button>
  <button id="front">정면</button>
  <button id="mode">밝은 배경(스캔용)</button>
</div>
<p id="msg" role="status"></p>
<p style="font-size:.8rem">검은 배경은 색이 반전된 QR이라 일부 스캐너가 못 읽을 수 있어요.<br>그럴 땐 '밝은 배경' 버튼을 눌러 스캔하세요.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>window.qrcode||document.write('<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"><\/script>')</script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),badge=document.getElementById('badge'),stage=document.getElementById('stage');
let pts=[],extra=[],N=25,H=12.5,S=3,yaw=0.9,pitch=0.12,auto=true,drag=false,lx=0,ly=0,snap=false,W=520,light=false;
const snow=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.0006+Math.random()*.0016,w:Math.random()*6}));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function msg(t){document.getElementById('msg').textContent=t}
function Rof(y){const t=(y+H)/N,loc=(t*3)%1;return H*(0.1+0.9*t)*(0.62+0.38*loc)}
function build(text){
  let qr;
  try{if(!window.qrcode)throw new Error('lib');qr=qrcode(0,'M');qr.addData(text);qr.make()}catch(e){msg(e.message==='lib'?'QR 라이브러리를 불러오지 못했어요. 새로고침해 주세요.':'텍스트가 너무 길어요. 더 짧게 입력해 주세요.');return false}
  msg('');N=qr.getModuleCount();H=N/2;pts=[];extra=[];
  const rng=mulberry(7);
  const gb=['#35e873','#1fcf5c','#7dffa8','#12b84e'],gd=['#0b4a24','#10602f','#083b1d','#0e5428'];
  const ob=['#ff3347','#ffd54a','#ffffff','#ff8a2a','#4db8ff'],od=['#8a1c1c','#6b3b00','#1c3f8a'];
  const mk=(qx,tx,y,z,f)=>{const o=rng()<0.08;return{qx,tx,y,z,f,o,b:o?ob[Math.floor(rng()*5)]:gb[Math.floor(rng()*4)],d:o?od[Math.floor(rng()*3)]:gd[Math.floor(rng()*4)],ph:rng()*6.28}};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!qr.isDark(r,c))continue;
    for(let i=0;i<S;i++)for(let j=0;j<S;j++){
      const x=c+(i+.5)/S-H,y=r+(j+.5)/S-H,R=Rof(y),tx=x*R/H;
      pts.push(mk(x,tx,y,(rng()*2-1)*Math.sqrt(Math.max(0,R*R-tx*tx)),false));
    }
  }
  for(let i=0;i<2600;i++){
    const y=-H+rng()*N,R=Rof(y),a=rng()*6.283,r=R*Math.sqrt(rng()),x=r*Math.cos(a);
    pts.push(mk(x,x,y,r*Math.sin(a),true));
  }
  for(let x=-1.5;x<=1.5;x+=.5)for(let y=H+.8;y<=H+3.6;y+=.5)for(let z=-1.5;z<=1.5;z+=.5)extra.push({qx:x,tx:x,y,z,f:true,o:false,b:'#b97a3e',d:'#5a3a1e',ph:rng()*6.28});
  for(let x=-1.5;x<=1.5;x+=.5)for(let y=-H-2.2;y<=-H-.2;y+=.5)for(let z=-1.5;z<=1.5;z+=.5)if(Math.abs(x)+Math.abs(z)<=1.6)extra.push({qx:x,tx:x,y,z,f:true,o:true,b:'#ffe27a',d:'#b8860b',ph:rng()*6.28});
  return true;
}
function resize(){const d=Math.min(devicePixelRatio||1,2),w=cv.clientWidth;W=w;cv.width=w*d;cv.height=w*d;ctx.setTransform(d,0,0,d,0,0)}
function frame(t){
  if(snap){const k=Math.round(yaw/(Math.PI*2))*Math.PI*2;yaw+=(k-yaw)*.14;pitch+=(0-pitch)*.14;if(Math.abs(k-yaw)<.002&&Math.abs(pitch)<.002){yaw=k;pitch=0;snap=false}}
  else if(auto&&!drag){yaw+=.006}
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const scale=W/(N+9),ps=scale/S+.7,front=cy*cp;
  let m=Math.min(1,Math.max(0,(front-.93)/.06));m=m*m*(3-2*m);
  const ea=1-m;
  ctx.clearRect(0,0,W,W);
  if(!light){
    ctx.fillStyle='#fff';
    for(const f of snow){f.y+=f.v;f.x+=Math.sin(t*.001+f.w)*.0004;if(f.y>1.02){f.y=-.02;f.x=Math.random()}
      const px=f.x*W,py=f.y*W,hb=(H+.5)*scale,ins=Math.abs(px-W/2)<hb&&Math.abs(py-W/2)<hb;ctx.globalAlpha=ins?.8*ea:.85;ctx.beginPath();ctx.arc(px,py,f.r,0,6.283);ctx.fill()}
  }
  const out=[];
  const proj=(p,px,pz)=>{const x1=px*cy+pz*sy,z1=-px*sy+pz*cy,y2=p.y*cp-z1*sp,z2=p.y*sp+z1*cp;out.push([z2,x1,y2,p])};
  for(const p of pts){const px=p.f?p.tx:p.tx+(p.qx-p.tx)*m;proj(p,px,p.z*(p.f?1:1-m))}
  if(ea>.01)for(const p of extra)proj(p,p.tx,p.z);
  out.sort((a,b)=>a[0]-b[0]);
  const amp=light?0:.5*ea;let sh=false;
  for(const o of out){
    const p=o[3],col=light?p.d:p.b;
    ctx.globalAlpha=(p.f?ea:1)*(1-amp*(.5+.5*Math.sin(t*.004+p.ph*3)));
    if(p.f&&ea<.02)continue;
    const g=!light&&p.o&&ea>.05;
    if(g){ctx.shadowColor=col;ctx.shadowBlur=11*ea;sh=true}else if(sh){ctx.shadowBlur=0;sh=false}
    ctx.fillStyle=col;ctx.fillRect(W/2+o[1]*scale-ps/2,W/2+o[2]*scale-ps/2,ps,ps);
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  badge.classList.toggle('on',m>.98);
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',e=>{drag=true;auto=false;snap=false;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*.01;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>{drag=false});
cv.addEventListener('pointercancel',()=>{drag=false});
document.getElementById('front').onclick=()=>{auto=false;snap=true};
const mb=document.getElementById('mode');
mb.onclick=()=>{light=!light;stage.classList.toggle('light',light);mb.textContent=light?'검은 배경(크리스마스)':'밝은 배경(스캔용)'};
const txt=document.getElementById('txt');
const apply=()=>{if(txt.value.trim())build(txt.value.trim())};
document.getElementById('apply').onclick=apply;
txt.addEventListener('keydown',e=>{if(e.key==='Enter')apply()});
txt.addEventListener('change',apply);
addEventListener('resize',resize);
build(txt.value);resize();requestAnimationFrame(frame);
</script>
</body>
</html>

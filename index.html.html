<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크리스마스에 저랑 놀래요?</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--night:#0e2420;--deep:#1a3b33;--lamp:#ffdca3;--berry:#e0556b;--snow:#f6faf7;--muted:#a8c2b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,var(--deep),var(--night) 70%);color:var(--snow);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:hidden}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}
main{position:relative;max-width:560px;margin:0 auto;padding:12vh 24px 48px;text-align:center}
.star{width:14px;height:14px;margin:0 auto 28px;background:var(--lamp);border-radius:50%;box-shadow:0 0 24px 10px rgba(255,220,163,.45)}
h1{font-family:"Jua","Apple SD Gothic Neo",sans-serif;font-weight:400;font-size:clamp(40px,11vw,64px);line-height:1.2;margin:0 0 18px;letter-spacing:-.01em}
h1 span{display:block}
.lead{font-size:19px;line-height:1.7;color:var(--muted);margin:0 0 36px}
dl{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;text-align:left;margin:0 auto 40px;padding:22px 24px;max-width:380px;border:1px solid rgba(255,220,163,.35);border-radius:18px;background:rgba(255,255,255,.04)}
dt{color:var(--lamp)}dd{margin:0}
.answer{position:relative;display:flex;gap:16px;justify-content:center;height:64px}
button{font:inherit;font-size:20px;padding:14px 30px;border-radius:999px;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#yes{background:var(--berry);color:#fff}
#no{background:transparent;color:var(--muted);border:1px solid var(--muted);transition:transform .25s}
#msg{min-height:30px;margin-top:26px;font-size:18px;color:var(--lamp)}
.done #ask,.done .answer{display:none}
#yay{display:none;font-family:"Jua",sans-serif;font-size:28px;line-height:1.5}
.done #yay{display:block}
@media (prefers-reduced-motion:reduce){.snow i{animation:none}#no{transition:none}}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<main id="page">
  <div class="star" aria-hidden="true"></div>
  <div id="ask">
    <h1><span>크리스마스에</span><span>저랑 놀래요?</span></h1>
    <p class="lead">그날 별다른 약속 없으면<br>저랑 같이 보내요.</p>
    <dl>
      <dt>날짜</dt><dd>12월 25일 (금)</dd>
      <dt>시간</dt><dd>오후 2시</dd>
      <dt>장소</dt><dd>만나서 같이 정해요</dd>
    </dl>
  </div>
  <div class="answer" id="answer">
    <button id="yes">좋아요</button>
    <button id="no">고민해 볼게요</button>
  </div>
  <p id="msg" aria-live="polite"></p>
  <div id="yay">좋아요!<br>그럼 12월 25일에 봐요 🎄<br>연락 기다릴게요</div>
</main>
<script>
var snow=document.getElementById('snow');
for(var i=0;i<36;i++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.width=s.style.height=(3+Math.random()*5)+'px';s.style.animationDuration=(7+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*12)+'s';snow.appendChild(s);}
var no=document.getElementById('no'),yes=document.getElementById('yes'),msg=document.getElementById('msg'),tries=0;
var lines=['버튼이 부끄러워서 도망갔어요','고민은 눈 오는 날 하기엔 아까워요','저 진짜 기다리고 있어요','같이 가면 재미있을 거예요','그냥 좋아요를 눌러 주세요'];
function dodge(){tries++;var x=(Math.random()-.5)*220,y=(Math.random()-.5)*120;no.style.transform='translate('+x+'px,'+y+'px)';msg.textContent=lines[Math.min(tries-1,lines.length-1)];}
no.addEventListener('mouseenter',dodge);
no.addEventListener('touchstart',function(e){e.preventDefault();dodge();},{passive:false});
no.addEventListener('click',dodge);
yes.addEventListener('click',function(){document.getElementById('page').classList.add('done');msg.textContent='';});
</script>
</body>
</html>
